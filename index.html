<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Address Checker</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      --card-bg: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-sub: #b0bec5;
      --accent: #4ade80;
      --accent-hover: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* グラスモーフィズム（ガラス風）デザインのカード */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .ip-address {
      font-size: 2rem;
      font-weight: 700;
      margin: 20px 0;
      word-break: break-all; /* IPv6が長い場合の折り返し */
      min-height: 48px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 30px;
      background: rgba(255, 255, 255, 0.1);
    }

    .status-badge.ipv6 {
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .status-badge.ipv4 {
      background: rgba(250, 204, 21, 0.2);
      color: #facc15;
      border: 1px solid rgba(250, 204, 21, 0.3);
    }

    .refresh-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .refresh-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .refresh-btn:active {
      transform: translateY(0);
    }

    /* ローディングアニメーション */
    .loading {
      opacity: 0.5;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">Your IP Address</div>
    <div id="ip-display" class="ip-address loading">Checking...</div>
    <div id="status-badge" class="status-badge">Detecting Protocol</div>
    <br>
    <button class="refresh-btn" onclick="fetchIP()">再チェック</button>
  </div>

  <script>
    async function fetchIP() {
      const ipDisplay = document.getElementById('ip-display');
      const statusBadge = document.getElementById('status-badge');

      // 取得中のUIリセット
      ipDisplay.textContent = 'Checking...';
      ipDisplay.classList.add('loading');
      statusBadge.textContent = 'Detecting Protocol';
      statusBadge.className = 'status-badge';

      try {
        // api64.ipify.org は IPv6 が使えれば IPv6 を、無理なら IPv4 を返します
        const response = await fetch('https://api64.ipify.org?format=json');
        const data = await response.json();
        const ip = data.ip;

        ipDisplay.textContent = ip;
        ipDisplay.classList.remove('loading');

        // IPアドレスにコロン(:)が含まれていればIPv6と判定
        if (ip.includes(':')) {
          statusBadge.textContent = 'IPv6 Ready (Direct Connection OK)';
          statusBadge.classList.add('ipv6');
        } else {
          statusBadge.textContent = 'IPv4 Only (CGNAT / NAT)';
          statusBadge.classList.add('ipv4');
        }
      } catch (error) {
        ipDisplay.textContent = 'Error fetching IP';
        ipDisplay.classList.remove('loading');
        statusBadge.textContent = 'Network Error';
        console.error('Error:', error);
      }
    }

    // ページ読み込み時に実行
    window.onload = fetchIP;
  </script>

</body>
</html>
